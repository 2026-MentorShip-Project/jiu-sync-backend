services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jiu_sync
      POSTGRES_USER: jiu_sync
      POSTGRES_PASSWORD: jiu_sync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
