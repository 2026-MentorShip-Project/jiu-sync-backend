# Production compose file — run from the EC2 host at /opt/jiu-sync-backend
# via `docker compose -f infra/docker/docker-compose.prod.yml ...`.
#
# .env lives alongside the repo clone (/opt/jiu-sync-backend/.env), i.e. two
# directories up from this file (infra/docker/ -> infra/ -> repo root), hence
# the "../../.env" path below.
#
# IMPORTANT — hostnames baked into .env:
# Django resolves DB/broker connections from full URLs, not separate
# host/port vars, so the production .env MUST point at the compose service
# names (Docker's internal DNS), not localhost:
#   DATABASE_URL=postgres://<user>:<password>@pgbouncer:6432/<dbname>
#   DATABASE_URL_DIRECT=postgres://<user>:<password>@db:5432/<dbname>
#   CELERY_BROKER_URL=redis://redis:6379/0
# CELERY_BROKER_URL is REQUIRED to be exactly redis://redis:6379/0 (the
# `redis` service). Both app (enqueues via .delay()) and worker (consumes)
# read it from the same .env, and the comment rate-limit lock URL is derived
# from it by default (/0 -> /1, unless COMMENT_RATE_LIMIT_REDIS_URL is set;
# config/settings/base.py). The settings default redis://localhost:6381/0 is
# for local dev only and is unreachable inside a container: .delay() then
# fails (caught and logged by the view, the API still succeeds, so no
# notification is ever queued) and the rate-limit lock fails open
# (design.md D5).
# app connects through PgBouncer (transaction pooling, see
# openspec/changes/add-pgbouncer-and-celery-worker design.md D1/D2).
# DATABASE_URL_DIRECT is used only by infra/scripts/deploy.sh to run
# `migrate` directly against db (design.md D3); deploy aborts if it is
# missing. The POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB values below must
# match the credentials embedded in both URLs.
#
# Connection pool status (from the EC2 host, inside the compose network):
#   docker compose -f docker-compose.prod.yml exec pgbouncer \
#     psql -h 127.0.0.1 -p 6432 -U <user> pgbouncer -c 'SHOW POOLS;'
#
# Rollback (PgBouncer holds no state): point DATABASE_URL back at
# db:5432 in .env and redeploy.
#
# Unlike local dev's docker-compose.yml, nothing here binds to 0.0.0.0 or a
# host port for db/redis/pgbouncer — only `app` is reachable from the host, and only
# via loopback (127.0.0.1:8000), per the "應用程式 port 不直接對外暴露"
# requirement. nginx (host-native, see design.md Decision 3) is the only
# thing that should ever reach app, over 127.0.0.1:8000.

services:
  app:
    image: ghcr.io/2026-mentorship-project/jiu-sync-backend:latest
    env_file:
      - ../../.env
    # Explicit, same as worker (design.md D6): `environment` overrides any
    # DJANGO_SETTINGS_MODULE in .env, so app and worker can never load
    # different settings (e.g. dev's CELERY_TASK_ALWAYS_EAGER=True would run
    # tasks in-process and never enqueue them). Don't rely on wsgi.py's
    # setdefault.
    # PROMETHEUS_MULTIPROC_DIR (add-observability-stack design.md D2): app only,
    # not worker. On the container's own /dev/shm tmpfs, so a container restart
    # starts metrics from zero; gunicorn.conf.py's on_starting clears it too.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      PROMETHEUS_MULTIPROC_DIR: /dev/shm/prometheus
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - pgbouncer
      - redis
    restart: unless-stopped

  # Celery worker (design.md D5): same image as app, consumes the queue that
  # app's .delay() fills (notification emails). --concurrency=1 for the
  # t2.micro memory budget. DJANGO_SETTINGS_MODULE is set explicitly because
  # config/celery.py refuses to start without it; it overrides any value in
  # .env and must match app's (design.md D6). Connects to the DB through
  # PgBouncer (same DATABASE_URL as app).
  # No ports: nothing needs to reach the worker.
  # Rollback: `docker compose -f docker-compose.prod.yml stop worker`
  # (notifications stop being sent; API unaffected).
  worker:
    image: ghcr.io/2026-mentorship-project/jiu-sync-backend:latest
    command: celery -A config worker -l info --concurrency=1
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - pgbouncer
      - redis
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 10
      MAX_CLIENT_CONN: 100
      LISTEN_PORT: 6432
      ADMIN_USERS: ${POSTGRES_USER}
      STATS_USERS: ${POSTGRES_USER}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # Grafana Alloy (add-observability-stack design.md D4–D9): scrapes app
  # /metrics, cadvisor (containers), unix exporter (host), tails docker + host
  # nginx logs, redacts, and pushes everything to Grafana Cloud.
  # Fault isolation (D9): nothing depends_on alloy and alloy depends on
  # nothing; if it dies or Grafana Cloud is unreachable the app is unaffected.
  # Rollback: `docker compose -f docker-compose.prod.yml stop alloy`.
  # Secrets (D5): only these six variables, interpolated from the .env next to
  # the project directory (same mechanism as pgbouncer). Never `env_file` —
  # alloy must not see DATABASE_URL, SECRET_KEY, etc. Missing values only make
  # deploy.sh print a WARNING (D9), so no `${VAR:?}` here.
  # Mounts (D8): every host path read-only; no privileged, no cap_add, no
  # pid: host. containerd.sock + /sys are what cadvisor needs to see Docker
  # containers (verified on EC2, see D8). Runs as the image's default root
  # user to read root:adm 640 nginx logs. UI port 12345 is not published.
  # The two infra/alloy/ file mounts are rewritten to ./ by deploy.sh for the
  # flat /opt/jiu-sync-backend/ layout, where deploy.sh also writes both files
  # (D4); after `up -d` deploy.sh runs `restart alloy` because a changed
  # bind-mounted file does not recreate the container.
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
      METRICS_TOKEN: ${METRICS_TOKEN}
      # Go GC works harder before hitting mem_limit (D8).
      GOMEMLIMIT: 150MiB
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../alloy/redact.alloy:/etc/alloy/redact.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /var/log/nginx:/var/log/nginx:ro
      # positions + remote_write WAL survive restarts: no resend, no gaps (D8).
      - alloy_data:/var/lib/alloy/data
    mem_limit: 200m
    restart: unless-stopped

volumes:
  postgres_data:
  alloy_data:
